<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>作業詳細</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<header>

    <h1>作業詳細</h1>

</header>

<main class="detail-main">

    <!-- ========================= -->
    <!-- 同じ園地の作業一覧 -->
    <!-- ========================= -->

    <h2 id="placeName"></h2>

    <table>

        <thead>

            <tr>
                <th>日付</th>
                <th>作業内容</th>
                <th>作業者</th>
                <th>備考</th>
                <th>操作</th>
            </tr>

        </thead>

        <tbody id="workTable">
        </tbody>

    </table>


    <!-- ========================= -->
    <!-- 作業更新フォーム -->
    <!-- ========================= -->

    <h2>作業内容の更新</h2>

    <form id="placeForm">

        <div class="form-group">
            <label for="place">園地</label>
            <input type="text"
                   id="place"
                   required>
        </div>


        <div class="form-group">
            <label for="date">日付</label>
            <input type="date"
                   id="date"
                   required>
        </div>


        <div class="form-group">
            <label for="name">作業内容</label>
            <input type="text"
                   id="name"
                   required>
        </div>


        <div class="form-group">
            <label for="worker">作業者</label>
            <input type="text"
                   id="worker"
                   required>
        </div>


        <div class="form-group">
            <label for="remarks">備考</label>
            <textarea id="remarks"></textarea>
        </div>


        <button type="submit">

            更新する

        </button>


        <button type="button"
                class="delete"
                onclick="deletePlace()">

            削除する

        </button>


        <button type="button"
                class="back"
                onclick="location.href='/place.html'">

            一覧へ戻る

        </button>


        <div class="message"
             id="message">
        </div>

    </form>

</main>


<script>

    // ========================================
    // URLからIDを取得
    // ========================================

    const params =
        new URLSearchParams(window.location.search);

    const id =
        params.get('id');


    // ========================================
    // 選択した作業を取得
    // ========================================

    function loadPlace() {

        fetch('/place/' + id)

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        '作業情報が見つかりません'
                    );

                }

                return response.json();

            })

            .then(place => {

                // 園地
                document.getElementById('place').value =
                    place.place;

                // 日付
                document.getElementById('date').value =
                    place.date;

                // 作業内容
                document.getElementById('name').value =
                    place.name;

                // 作業者
                document.getElementById('worker').value =
                    place.worker;

                // 備考
                document.getElementById('remarks').value =
                    place.remarks;

                // 園地名を表示
                document.getElementById('placeName').textContent =
                    place.place + ' の作業一覧';


                // 同じ園地の作業を取得
                loadSamePlaceWorks(place.place);

            })

            .catch(error => {

                document.getElementById('message').textContent =
                    error.message;

            });

    }


    // ========================================
    // 同じ園地の作業を取得
    // ========================================

    function loadSamePlaceWorks(placeName) {

        /*
         * ここはJava側に作成するAPIに合わせます。
         *
         * 例：
         * GET /place/search?place=A園地
         */

        fetch('/place/search?place=' +
              encodeURIComponent(placeName))

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        '園地の作業一覧を取得できません'
                    );

                }

                return response.json();

            })

            .then(data => {

                const table =
                    document.getElementById('workTable');

                table.innerHTML = '';


                data.forEach(work => {

                    const row =
                        document.createElement('tr');


                    row.innerHTML = `

                        <td>${work.date}</td>

                        <td>${work.name}</td>

                        <td>${work.worker}</td>

                        <td>${work.remarks || ''}</td>

                        <td>

                            <button
                                onclick="editWork(${work.placeId})">

                                編集

                            </button>

                        </td>

                    `;


                    table.appendChild(row);

                });

            })

            .catch(error => {

                document.getElementById('message').textContent =
                    error.message;

            });

    }


    // ========================================
    // 一覧から作業を選択して編集
    // ========================================

    function editWork(workId) {

        location.href =
            '/detail.html?id=' + workId;

    }


    // ========================================
    // 更新処理
    // ========================================

    document.getElementById('placeForm')
        .addEventListener('submit', function(event) {

            event.preventDefault();


            const place = {

                place:
                    document.getElementById('place').value,

                date:
                    document.getElementById('date').value,

                name:
                    document.getElementById('name').value,

                worker:
                    document.getElementById('worker').value,

                remarks:
                    document.getElementById('remarks').value

            };


            fetch('/place/' + id, {

                method: 'PUT',

                headers: {

                    'Content-Type':
                        'application/json'

                },

                body:
                    JSON.stringify(place)

            })

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        '更新に失敗しました'
                    );

                }

                return response.json();

            })

            .then(data => {

                alert(
                    '作業情報を更新しました'
                );

                // 更新後、一覧を再表示
                loadPlace();

            })

            .catch(error => {

                document.getElementById('message').textContent =
                    error.message;

            });

        });


    // ========================================
    // 削除処理
    // ========================================

    function deletePlace() {

        if (!confirm(
            'この作業を削除しますか？'
        )) {

            return;

        }


        fetch('/place/' + id, {

            method: 'DELETE'

        })

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    '削除に失敗しました'
                );

            }

            return response.text();

        })

        .then(message => {

            alert(message);

            location.href =
                '/place.html';

        })

        .catch(error => {

            document.getElementById('message').textContent =
                error.message;

        });

    }


    // ========================================
    // ページ読み込み時
    // ========================================

    loadPlace();

</script>

</body>

</html>
